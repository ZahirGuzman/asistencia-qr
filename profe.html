<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de QR de Asistencia</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #2c3e50; color: white; }
        #qrcode { background: white; padding: 20px; border-radius: 10px; }
        h2 { margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Escaneen para el Presente</h2>
    <div id="qrcode"></div>
    <p id="url-texto"></p>

    <script>

        const miWebUrl = "https://ZahirGuzman.github.io/asistencia/index.html";

  
        const hoy = new Date().toISOString().split('T')[0];


        const urlFinal = `${miWebUrl}?token=${hoy}`;


        new QRCode(document.getElementById("qrcode"), {
            text: urlFinal,
            width: 300,
            height: 300
        });

        document.getElementById("url-texto").innerText = "Token del día: " + hoy;
    </script>
</body>
</html>
