<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del Profesor - Generador QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #2c3e50; color: white; }
        #qrcode { background: white; padding: 20px; border-radius: 10px; }
        h2 { margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Asistencia - QR del Día</h1>
    <div id="qrcode"></div>
    <p id="url-texto"></p>

    <script>
     
        const miWebUrl = "https://ZahirGuzman.github.io/asistencia-qr/index.html";


        const fechaLocal = new Date().toLocaleDateString('en-CA'); 


        const urlFinal = miWebUrl + "?token=" + fechaLocal;

        new QRCode(document.getElementById("qrcode"), {
            text: urlFinal,
            width: 256,
            height: 256
        });


      document.getElementById("url-texto").innerText = "Token del día: " + fechaLocal;
    </script>
</body>
</html>
