<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del Profesor - Generador QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        #qrcode { margin-top: 20px; display: flex; justify-content: center; }
    </style>
</head>
<body>
    <h1>Asistencia - QR del Día</h1>
    <div id="qrcode"></div>
    <p id="url-texto"></p>

    <script>
     
        const miWebUrl = "https://ZahirGuzman.github.io/asistencia-qr/index.html";


        const fechaLocal = new Date().toLocaleDateString('en-CA'); 


        const urlFinal = miWebUrl + "?token=" + fechaLocal;

        new QRCode(document.getElementById("qrcode"), {
            text: urlFinal,
            width: 256,
            height: 256
        });


        document.getElementById("url-texto").innerText = "Link generado: " + urlFinal;
    </script>
</body>
</html>
