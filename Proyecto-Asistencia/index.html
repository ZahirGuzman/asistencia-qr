<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Asistencia Escolar</h1>
        <div id="seccion-identificacion">
            <p>Ingresá tus datos para continuar:</p>
            <input type="text" id="inputNombre" placeholder="Nombre y Apellido">
            <input type="email" id="inputEmail" placeholder="Correo electrónico">
        </div>
        
        <p id="instruccion">Presione el botón para registrar asistencia</p>
        
        <button id="btnAsistencia">
            Registrar asistencia
        </button>

        <div id="mensaje"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
